# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind a TLS-terminating reverse proxy (kivvi.click), so the scheme, host and client IP
    # arrive in X-Forwarded-* headers. Without trusting them Symfony would generate http://
    # URLs and mark session cookies as non-secure.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Host header allow-list: the app answers only for hosts it knows.
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    # Sessions are stored in Postgres (architecture decision). The PdoSessionHandler
    # service is wired in config/services.yaml against the Doctrine DBAL connection.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
