---
# Production overlay for Spring Boot + Vue 3 SPA behind the Mercure edge.
# See README.md's Production operations for deployment commands.
# Existing production volumes retain their explicit kivvi-next_* names. Keep these names
# stable: changing them would attach empty volumes instead of the live production data.
services:
  api:
    image: ${IMAGES_PREFIX:-}kivvi-click-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The base file mounts ./var/mail for the dev profile's .eml maildrop. Production sends over
    # SMTP and must never write a message to disk, so the list is reset rather than inherited —
    # Compose merges volume lists instead of replacing them.
    volumes: !reset []
    environment:
      # Anything but `dev`. Under `dev` the application diverts mail to a directory; here it must
      # refuse to start unless SPRING_MAIL_HOST names a real relay (MailConfigurationGuard).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Derived from the same POSTGRES_* keys the `database` service below uses — one
      # documented secret (POSTGRES_PASSWORD), not a second, independently-named one that an
      # operator could set for `database` and forget for `api` (or vice versa).
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # All three Mercure JWT env var names the api/mercure containers read are derived from
      # the one documented secret MERCURE_JWT_SECRET (.env.prod.docker(.example)) — no default,
      # unlike the dev-only placeholder in compose.yaml.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      # This app's server.forward-headers-strategy is `native` (application.yml) with no explicit
      # server.tomcat.remoteip.internal-proxies override, so Tomcat's own built-in
      # private-range regex applies — it already matches every RFC1918 range the compose
      # bridge network can hand out. `api` publishes no host port (see compose.yaml): the
      # `mercure` edge is the only path in, so there is no CIDR an operator could usefully
      # narrow this to. See application.yml's `server.forward-headers-strategy` comment.
      #
      # PIO-71: transactional mail. Brevo's SMTP relay, addressed entirely through spring.mail.*
      # so swapping providers is these four values and nothing else. The password is Brevo's SMTP
      # key (SMTP & API -> SMTP), not the account password and not an API v3 key. All of them, and
      # the unsubscribe-link secret, live in .env.prod.docker — never in this file.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      KIVVI_BASE_URL: ${KIVVI_BASE_URL:-https://kivvi.click}
      KIVVI_MAIL_FROM_ADDRESS: ${KIVVI_MAIL_FROM_ADDRESS:-no-reply@kivvi.click}
      # Rotating this invalidates every unsubscribe link already in the wild — see
      # domain/waitlist/UnsubscribeToken.java.
      KIVVI_UNSUBSCRIBE_SECRET: ${KIVVI_UNSUBSCRIBE_SECRET}

  mercure:
    environment:
      # TLS is terminated by the reverse proxy in front of this stack, so Caddy serves
      # plain HTTP on the published port and the public address is configured, not derived.
      # This bare `:80` (no hostname) already matches any Host header on port 80 without an
      # HTTPS redirect — verified empirically — so the api container's internal
      # MERCURE_URL=http://mercure/.well-known/mercure (base compose.yaml, inherited
      # here unchanged) needs no `mercure:80`-style second address the way the dev overlay's
      # SERVER_NAME does.
      SERVER_NAME: ${SERVER_NAME:-:80}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
    volumes:
      - mercure_data_next:/data
      - mercure_config_next:/config
    # Compose merges "ports" entries by target port rather than replacing the list, so the
    # base stack's https/http3 entries must be dropped explicitly: TLS terminates at the
    # external proxy in front of this host, this edge only needs the plain HTTP port.
    ports: !override
      - name: http
        target: 80
        published: ${HTTP_PORT:-23456}
        protocol: tcp

  # Production uses a dedicated cluster and explicit volume names, separate from dev.
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data_next:/var/lib/postgresql:rw
    ports: !reset []

volumes:
  # Literal production volume names are independent of -p/COMPOSE_PROJECT_NAME.
  # Development must use the base compose.yaml without this production overlay.
  database_data_next:
    name: kivvi-next_database_data
  mercure_data_next:
    name: kivvi-next_mercure_data
  mercure_config_next:
    name: kivvi-next_mercure_config
