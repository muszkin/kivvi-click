---
# Production stack as deployed by Portainer on the `nas` environment.
#
# This is the file Portainer reads from the repository; it replaces the local
# `compose.yaml + compose.prod.yaml` overlay for production only. Development still uses the
# base compose.yaml (see CLAUDE.md), which keeps its `build:` section — here `api` is never
# built, only pulled: GitHub Actions builds the image, pushes it to GHCR, and calls this
# stack's webhook, which makes Portainer re-pull and recreate the container.
#
# Flattened on purpose. The overlay pair relies on `!override` / `!reset`, which resolve
# through `docker compose -f a -f b`; Portainer deploys a single compose path, so the merged
# result is written out here rather than left to a merge that would not happen.
#
# The volumes are declared external under the names the live production data already uses.
# A non-external declaration would have Portainer create empty `<stack>_database_data`
# volumes and the site would come up with no sessions, no ShedLock row and an empty schema
# that Flyway would then migrate from scratch.
services:
  api:
    # Tag, not digest: the deploy workflow pushes both `latest` and the commit SHA, and the
    # webhook redeploy pulls whatever `latest` points at. Rolling back is setting API_TAG to a
    # previous SHA in the stack's environment variables and redeploying.
    image: ghcr.io/muszkin/kivvi-click-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # All three names the api container reads derive from the single documented secret,
      # exactly as compose.prod.yaml did — one secret to rotate, not three to keep in step.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      MERCURE_URL: http://mercure/.well-known/mercure
      # Brevo, wired ahead of PIO-71 so the double opt-in has a relay to send through the
      # moment it merges. Inert until then: nothing on `main` reads these yet.
      #
      # These are Spring Boot's own relaxed-binding names — SPRING_MAIL_HOST binds
      # spring.mail.host with no entry in application.yml at all — so PIO-71 must not invent
      # its own. The password is Brevo's SMTP key, which is NOT the v3 API key; the two are
      # separate credentials and using one where the other belongs fails with a bare
      # authentication error.
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      # The From address. `piotr@kivvi.click` is the verified sender on the authenticated
      # domain — sending as anything else on kivvi.click would break DKIM alignment.
      KIVVI_MAIL_FROM: ${MAIL_FROM:-piotr@kivvi.click}
      # Contact-list sync: after an address confirms, it is added to this Brevo list, which is
      # what the launch campaign will target. Brevo owns the list and nothing else — the token,
      # the consent proof and the confirmation e-mail stay in this application.
      KIVVI_BREVO_API_KEY: ${BREVO_API_KEY}
      KIVVI_BREVO_LIST_ID: ${BREVO_LIST_ID:-3}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      timeout: 5s
      retries: 10
      start_period: 30s

  mercure:
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    environment:
      # TLS terminates upstream (Cloudflare tunnel → this port), so the edge serves plain
      # HTTP. A bare `:80` matches any Host header without an automatic-HTTPS redirect, which
      # also makes the api container's internal http://mercure/... publish work unchanged.
      SERVER_NAME: ${SERVER_NAME:-:80}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
    configs:
      # Inlined rather than bind-mounted from ./mercure/Caddyfile. Portainer checks the
      # repository out inside its own container, at /data/compose/<id>/<sha>/, and the Docker
      # daemon resolves a bind-mount source on the HOST, where that path does not exist — the
      # mercure container then fails to start with "not a directory". An inline config is
      # written into the container by the daemon itself, so no host path is involved.
      #
      # Kept byte-identical to mercure/Caddyfile except for Compose's own `$` escaping, and CI
      # fails if the two drift apart (see .github/workflows/build.yml).
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    depends_on:
      api:
        condition: service_healthy
    # Only the plain HTTP port is published: the Cloudflare tunnel connects here, and this
    # port number is load-bearing — changing it breaks the tunnel, not just a bookmark.
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-23456}
        protocol: tcp

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Postgres 18+ keeps the cluster in a versioned subdirectory of /var/lib/postgresql;
      # mounting .../data directly makes the entrypoint abort.
      - database_data:/var/lib/postgresql:rw
    # No published port: the database is reachable only over this stack's private network.

configs:
  caddyfile:
    content: |
      # Mercure hub as the public edge: serves /.well-known/mercure* and reverse-proxies
      # application requests to Spring Boot. TLS is automatic in dev; production terminates
      # TLS at the upstream proxy and configures this edge to serve plain HTTP.

      {
      	{$$GLOBAL_OPTIONS}
      }

      {$$CADDY_EXTRA_CONFIG}

      {$$SERVER_NAME:localhost} {
      	log {
      		# Redact the authorization query parameter that can be set by Mercure
      		format filter {
      			request>uri query {
      				replace authorization REDACTED
      			}
      		}
      	}

      	encode zstd gzip

      	mercure {
      		# Publisher JWT key
      		publisher_jwt {env.MERCURE_PUBLISHER_JWT_KEY} {env.MERCURE_PUBLISHER_JWT_ALG}
      		# Subscriber JWT key
      		subscriber_jwt {env.MERCURE_SUBSCRIBER_JWT_KEY} {env.MERCURE_SUBSCRIBER_JWT_ALG}
      		# Allow anonymous subscribers (double-check that it's what you want)
      		anonymous
      		# Enable the subscription API (double-check that it's what you want)
      		subscriptions
      		# Extra directives
      		{$$MERCURE_EXTRA_DIRECTIVES}
      	}

      	{$$CADDY_SERVER_EXTRA_DIRECTIVES}

      	header ?Permissions-Policy "browsing-topics=()"

      	# Actuator stays internal-only: the edge is the only publicly reachable surface, and
      	# health checks that need it (this compose file's own) hit the api container directly.
      	respond /actuator/* 404

      	reverse_proxy api:8080
      }

volumes:
  database_data:
    external: true
    name: kivvi-next_database_data
  mercure_data:
    external: true
    name: kivvi-next_mercure_data
  mercure_config:
    external: true
    name: kivvi-next_mercure_config
