---
# Application stack: Spring Boot API + Vue 3 SPA behind the Mercure hub as the edge. Postgres
# is the only other backing service — see CLAUDE.md's Architecture decisions. Dev/verification
# shape; compose.prod.yaml layers the production overrides on top.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # PIO-71. `dev` is the development default and the production overlay pins `prod`. The
      # profile decides how mail leaves: under `dev` every message is written to ./var/mail as an
      # .eml (so the Playwright suite can read a confirmation link without a mail container, and
      # Postgres stays the only backing service); under anything else the application refuses to
      # start without an SMTP relay configured.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Publish over the private Compose network. MERCURE_INTERNAL_URL configures the
      # endpoint injected as MERCURE_URL into the API container.
      # The explicit mercure:80 site below serves plain HTTP without an HTTPS redirect.
      MERCURE_URL: ${MERCURE_INTERNAL_URL:-http://mercure/.well-known/mercure}
      # The links inside the messages the dev profile drops in ./var/mail. Without this they would
      # fall back to application.yml's production default, and a developer clicking a link in their
      # own maildrop would land on kivvi.click. Override it when the stack runs on another port
      # than the 8443 this default assumes.
      KIVVI_BASE_URL: ${KIVVI_BASE_URL:-https://localhost:8443}
    volumes:
      # The dev maildrop, on the host so the end-to-end suite — which runs outside the container —
      # can read what the `dev` profile wrote. compose.prod.yaml resets this list: production talks
      # to a relay and writes no mail to disk at all.
      - ./var/mail:/app/var/mail
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      timeout: 5s
      retries: 10
      start_period: 30s

  mercure:
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    environment:
      # The public address uses automatic HTTPS; mercure:80 accepts internal HTTP
      # publishes from the API without a redirect.
      SERVER_NAME: ${SERVER_NAME:-localhost}, mercure:80
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - ./mercure/Caddyfile:/etc/caddy/Caddyfile:ro
      - mercure_data:/data
      - mercure_config:/config
    depends_on:
      api:
        condition: service_healthy
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Postgres 18+ images keep the cluster in a versioned subdirectory of
      # /var/lib/postgresql; mounting .../data directly makes the entrypoint abort.
      - database_data:/var/lib/postgresql:rw
    # No fixed host port: Compose assigns a random one,
    # discoverable with `docker compose -p <project> port database 5432`.
    ports:
      - target: 5432
        protocol: tcp

volumes:
  mercure_data:
  mercure_config:
  database_data:
