name: Build

# Spring Boot + Vue 3 SPA CI. Testcontainers pulls its own Postgres 18 image and talks to
# the runner's already-present Docker daemon — no external Postgres service container needed.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose*.yaml"
      - "mercure/**"
      - "tools/migration-verify/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose*.yaml"
      - "mercure/**"
      - "tools/migration-verify/**"
      - ".github/workflows/build.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 26 (for the embedded frontend build)
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA and copy it into the jar's static resources
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../backend/src/main/resources/static
          mkdir -p ../backend/src/main/resources/static
          cp -r dist/. ../backend/src/main/resources/static/

      - name: mvnw verify (unit + Testcontainers integration + ArchUnit + Spotless)
        working-directory: backend
        run: ./mvnw -B -q verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Unit + integration tests
        working-directory: frontend
        run: |
          npm run test -- --run
          npm run test:integration -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  # Exercises the actual artifact production deploys — compose.yaml/compose.prod.yaml
  # both build `api` from this same Dockerfile. Build-only, no push: this job exists purely
  # to catch a broken COPY/stage reference before it reaches a runbook.
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: kivvi-click-api:ci
