name: Build

# Spring Boot + Vue 3 SPA CI. Testcontainers pulls its own Postgres 18 image and talks to
# the runner's already-present Docker daemon — no external Postgres service container needed.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose*.yaml"
      - "mercure/**"
      - "tools/migration-verify/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose*.yaml"
      - "mercure/**"
      - "tools/migration-verify/**"
      - ".github/workflows/build.yml"

jobs:
  backend:
    # Runner chosen by trust, not convenience: a pull request — which anyone can open
    # once this repository is public — runs on GitHub's infrastructure, while pushes to
    # `main` keep using the home runner that also hosts production. Pinning every job to
    # the self-hosted runner would let a fork execute arbitrary code on that machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "home"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 26 (for the embedded frontend build)
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA and copy it into the jar's static resources
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../backend/src/main/resources/static
          mkdir -p ../backend/src/main/resources/static
          cp -r dist/. ../backend/src/main/resources/static/

      - name: mvnw verify (unit + Testcontainers integration + ArchUnit + Spotless)
        working-directory: backend
        run: ./mvnw -B -q verify

  frontend:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "home"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Unit + integration tests
        working-directory: frontend
        run: |
          npm run test -- --run
          npm run test:integration -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  # Exercises the actual artifact production deploys — compose.yaml/compose.prod.yaml
  # both build `api` from this same Dockerfile. On a pull request this is build-only, to catch
  # a broken COPY/stage reference before it reaches a runbook. On `main` the same build is
  # pushed to GHCR, which is where the Portainer-managed production stack pulls `api` from.
  backend-image:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "home"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          # Pushed only from `main`; a pull request must never publish an image tagged
          # `latest`, because that tag is what production pulls.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Two tags on purpose: `latest` is what the stack pulls, the commit SHA is what a
          # rollback pins. Set API_TAG to a SHA in the stack's environment to go back.
          tags: |
            ghcr.io/muszkin/kivvi-click-api:latest
            ghcr.io/muszkin/kivvi-click-api:${{ github.sha }}

  # The inlined Caddyfile in compose.portainer.yaml has to stay identical to the one the dev
  # stack bind-mounts, or the production edge quietly diverges from what anyone reads or tests
  # locally. Portainer cannot bind-mount it (see that file's comment), so this is the guard.
  compose-consistency:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "home"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: The Portainer stack's inlined Caddyfile matches mercure/Caddyfile
        run: |
          python3 - <<'PY'
          import pathlib, sys

          # Deliberately stdlib-only: the runner has no PyYAML, and a CI guard that needs its
          # own dependency installed is a guard that gets disabled the first time it breaks.
          # The block is read textually, which is all a literal scalar needs.
          INDENT = " " * 6
          lines = pathlib.Path("compose.portainer.yaml").read_text(encoding="utf-8").splitlines()
          try:
              start = lines.index("    content: |") + 1
          except ValueError:
              sys.exit("compose.portainer.yaml has no inlined `content: |` block for the Caddyfile.")

          block = []
          for line in lines[start:]:
              if line.strip() and not line.startswith(INDENT):
                  break
              block.append(line[len(INDENT):] if line.startswith(INDENT) else "")

          # Compose interpolates the inlined content, so every `$` is doubled there.
          inlined = "\n".join(block).replace("$$", "$")
          canonical = pathlib.Path("mercure/Caddyfile").read_text(encoding="utf-8")

          if inlined.strip() != canonical.strip():
              sys.exit(
                  "compose.portainer.yaml's inlined Caddyfile has drifted from mercure/Caddyfile.\n"
                  "Regenerate it from that file, escaping every '$' as '$$'."
              )
          print("The inlined Caddyfile matches mercure/Caddyfile.")
          PY

  # Deploys production. Runs only after every gate above is green, and only for `main`:
  # merging a PR is what ships. The webhook redeploys exactly one Portainer stack and can do
  # nothing else, which is why it, and not a Portainer API token, is the secret held here.
  deploy:
    runs-on: [self-hosted, home]
    needs: [backend, frontend, backend-image, compose-consistency]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger the Portainer stack redeploy
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "Portainer webhook answered HTTP $status"
          # 2xx only. A 404 means the stack or its webhook is gone, and silently carrying on
          # would report a deployment that never happened.
          case "$status" in 2??) ;; *) exit 1 ;; esac

      # The webhook answers 204 the moment it accepts the request, not when the stack is back
      # up — so the step above proves "accepted", never "deployed". Without this, a redeploy
      # that leaves production down still paints the run green. This does not prove the new
      # commit is live (that would need a build-info endpoint the app does not expose yet); it
      # proves the site survived the deploy, which is the failure worth catching here.
      - name: The site is serving after the redeploy
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              https://kivvi.click/pl || echo 000)
            if [ "$status" = "200" ]; then
              echo "kivvi.click is serving (HTTP 200) after $((attempt * 5))s"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status"
            sleep 5
          done
          echo "kivvi.click did not return 200 within 150s of the redeploy"
          exit 1
