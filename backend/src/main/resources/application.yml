spring:
  application:
    name: kivvi-click
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:!ChangeMe!}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30m
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  # PIO-71. Transactional mail goes out over a plain SMTP relay — Brevo today
  # (context/research/2026-09-15-transactional-email-provider.md), which is all EU processing with
  # a DPA and no standard contractual clauses. Every value here comes from the environment and
  # NOTHING is defaulted to a credential: .env.prod.docker holds the real ones and is ignored by
  # both Git and Docker. Swapping providers is these four variables, not a code change.
  #
  # `host` deliberately defaults to empty rather than to a plausible-looking server: outside the
  # `dev` profile MailConfigurationGuard refuses to start the application on a blank host. Not
  # starting is the honest failure — the dishonest one is starting up and silently dropping every
  # confirmation a visitor is waiting for.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Off only where there is nothing to authenticate against: GreenMail in the tests.
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
            # `required` as well as `enable`: with only `enable`, a relay that answers without
            # advertising STARTTLS is talked to in the clear, and the credentials go with it.
            required: ${SPRING_MAIL_SMTP_STARTTLS:true}
          # A relay that stops answering must not be able to pin the sender's single thread. The
          # claim lease in mail_outbox is ten minutes; these three keep one message far inside it.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      # No upload_max_filesize/post_max_size override was ever found in the old stack's own
      # config (frankenphp/conf.d/*.ini, config/packages/*.yaml) — it ran on FrankenPHP's
      # stock php.ini-production defaults, where upload_max_filesize=2M and post_max_size=8M.
      # 8MB here matches that post_max_size ceiling (the binding one — it also caps the
      # multipart body as a whole, same as this property does), so /import/upload accepts
      # everything the old stack did and nothing it didn't. Boot's own un-set defaults
      # (1MB/file, 10MB/request) are narrower on the file side and looser on the request side
      # — an unintentional, undocumented parity gap otherwise.
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: 8080
  # `native` configures Tomcat's RemoteIpValve, which only trusts X-Forwarded-* from a
  # connection whose *actual* peer IP matches server.tomcat.remoteip.internal-proxies — left
  # unset here, so Tomcat's own built-in regex (10/8, 172.16/12, 192.168/16, 169.254/16,
  # 127/8, loopback) applies, which already covers every RFC1918 range a Docker compose
  # bridge network can hand out. `framework` (the previous value) had no such check at all:
  # ForwardedHeaderFilter honours these headers from ANY caller unconditionally, which would
  # have been a real spoofing gap the day `api` is ever given a published host port — today
  # it has none (compose.yaml), reachable only from the trusted `mercure` edge over the
  # private compose network, but `native` costs nothing and removes the gap outright. See
  # compose.prod.yaml's `api` service comment for why no TRUSTED_PROXIES env var feeds
  # this (a Tomcat regex and Symfony's `private_ranges`/CIDR syntax are not interchangeable —
  # threading the old value through unmodified would have silently matched nothing).
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # The only entry point into this stack is the TLS-terminating Mercure edge (both
        # dev and prod), so every request that reaches this app is, in effect, always
        # HTTPS — hard-coded rather than left to request.isSecure() via
        # forward-headers-strategy, which Spring Session's cookie serializer does not
        # consult for this property despite that strategy being set above. This is already
        # correct for prod as-is: unlike forward-headers-strategy, this value does not need
        # to vary by environment.
        secure: true

# Kept off the public edge: the Mercure hub only reverse-proxies to /api/*, /{locale}/*,
# /preferences/* and /*.well-known/mercure, never to /actuator/*.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

kivvi:
  supported-locales: pl,en
  default-locale: pl
  scheduling:
    heartbeat:
      # Symfony's `RecurringMessage::every('1 hour', new Heartbeat())` (src/Schedule.php).
      # Test-only profiles shorten this to observe a tick without waiting an hour — never
      # override it in the default profile.
      interval: PT1H
  mercure:
    # Internal publish endpoint: the `mercure` compose service, reached over the private
    # docker network — never the public edge port. Plain HTTP, mirroring the old stack's own
    # MERCURE_URL (compose.yaml: http://php/.well-known/mercure) — see compose.yaml's
    # `mercure` service SERVER_NAME (adds a second, explicit-port `mercure:80` address so
    # Caddy serves this one plain, with no automatic-HTTPS redirect) and
    # HttpMercurePublisher's class comment.
    url: ${MERCURE_URL:http://mercure/.well-known/mercure}
    jwt-secret: ${MERCURE_JWT_SECRET:!ChangeThisMercureHubJWTSecretKey!}
  cleanup:
    # Hourly housekeeping sweep (ExpiredRowsCleanupJob): lapsed event_dedup claims and lapsed
    # waitlist_throttle windows. Mirrors the old stack's cache TTL sweep cadence; piggybacks on
    # the wave-1 scheduler (SchedulingConfig's single TaskScheduler bean and
    # @EnableSchedulerLock), so no new scheduling infrastructure is introduced here. Was
    # kivvi.tracking.dedup-cleanup.interval while the job swept only event_dedup; that key was
    # set nowhere outside this file.
    interval: PT1H
    # Stated here for discoverability; the job defaults to on when the key is absent. Only the
    # integration tests that assert on the tables it sweeps set it to false, so the sweep that
    # a @Scheduled fixedRate task performs at context startup cannot delete a row between such
    # a test's setup and its assertion. Never set this to false outside tests.
    enabled: true
  mail:
    # Absolute links for a message composed now and delivered by a background job later, possibly
    # after a restart. There is no request to derive a host from at that point — and deriving one
    # from a visitor-controlled Host header is how a confirmation link ends up pointing at somebody
    # else's server.
    base-url: ${KIVVI_BASE_URL:https://kivvi.click}
    from-address: ${KIVVI_MAIL_FROM_ADDRESS:no-reply@kivvi.click}
    from-name: ${KIVVI_MAIL_FROM_NAME:kivvi·click}
    # Derives the unsubscribe link from the subscriber's id (domain.waitlist.UnsubscribeToken), so
    # a link that has to work a year from now can be rebuilt for every message without the token
    # ever being stored in the clear. The placeholder mirrors MERCURE_JWT_SECRET's: a value that
    # says out loud it must be replaced, never a plausible-looking one.
    #
    # Rotating this invalidates every unsubscribe link already in the wild. That is the price of a
    # link that never expires, and it is why the value belongs in .env.prod.docker and nowhere else.
    unsubscribe-secret: ${KIVVI_UNSUBSCRIBE_SECRET:!ChangeThisWaitlistUnsubscribeSecret!}
    # Where the dev profile drops .eml files instead of connecting to a relay. Relative to the api
    # container's working directory (/app — see backend/Dockerfile), and mounted from the host in
    # compose.yaml so the Playwright suite can read what the container wrote.
    dev-directory: ${KIVVI_MAIL_DEV_DIRECTORY:./var/mail}
    sender:
      # Stated for discoverability; the job defaults to on when the key is absent. The integration
      # tests that drive the outbox by hand turn it off so a background run cannot claim a row out
      # from under an assertion. Never set this to false outside tests.
      enabled: true
      # Fast enough that a confirmation feels immediate, slow enough that an idle stack is not
      # polling Postgres in a tight loop.
      interval: PT30S
      batch-size: 20
    # How long a delivered message stays in mail_outbox before the hourly sweep drops it. Failed
    # rows are never swept: they are the evidence that something did not arrive.
    sent-retention: P30D
  import:
    # Relative to the api container's working directory (/app — see backend/Dockerfile), so
    # this resolves to /app/var/import — mirrors the old stack's own `var/import`. A path
    # inside the container, not a named volume: the journey has no need to survive a container
    # restart (see worker-report.md's "compose" section for why compose.yaml stays
    # untouched).
    upload-directory: ${KIVVI_IMPORT_UPLOAD_DIRECTORY:./var/import}
