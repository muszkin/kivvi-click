mail.waitlist.confirm.preheader=One click and you are on the list.
mail.waitlist.confirm.heading=One more click
mail.waitlist.confirm.intro=Someone — we hope it was you — put this address on the kivvi·click waiting list. Confirm that this is your mailbox and we will write exactly once: when we launch.
mail.waitlist.confirm.button=Confirm my address
mail.waitlist.confirm.expiry=The link is good for 7 days. After that, just sign up again and we will send a new one.
mail.waitlist.confirm.fallback=If the button does not work, copy this address into your browser:
mail.waitlist.confirm.ignore=If this was not you, do nothing — without a confirmation we will send nothing else, and the address will be removed.
mail.unsubscribe=Unsubscribe
