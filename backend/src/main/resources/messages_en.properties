# Waitlist signup (PIO-70). See messages_pl.properties for why waitlist.consent.text must match
# landingPage.waitlist.consent in frontend/src/i18n/messages/landing.en.ts word for word.
waitlist.consent.text=I agree to receive a single notification by e-mail when kivvi·click launches.
waitlist.error.email.empty=Enter an e-mail address.
waitlist.error.email.malformed=That does not look like a valid e-mail address.
waitlist.error.consent.required=Tick the consent box so we can send you the notification.
