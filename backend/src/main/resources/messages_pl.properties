# Waitlist signup (PIO-70). waitlist.consent.text is stored verbatim as the consent proof on
# every subscriber row, so it must stay word-for-word identical to the clause the form renders
# (landingPage.waitlist.consent in frontend/src/i18n/messages/landing.pl.ts) — the record would
# otherwise attest to wording the visitor never read.
waitlist.consent.text=Zgadzam się na otrzymanie jednorazowego powiadomienia o starcie kivvi·click na podany adres e-mail.
waitlist.error.email.empty=Podaj adres e-mail.
waitlist.error.email.malformed=To nie wygląda na poprawny adres e-mail.
waitlist.error.consent.required=Zaznacz zgodę, żebyśmy mogli wysłać Ci powiadomienie.
waitlist.error.throttled=Za dużo prób z tego miejsca. Spróbuj ponownie za godzinę.

# Waitlist confirmation mail (PIO-71). Rendered by templates/email/waitlist-confirmation.html
# (HTML part) and by WaitlistMailComposer (plain-text part) from exactly these keys, so a message
# reads the same either way round. mail.unsubscribe is the footer link every mail this system ever
# sends will carry - keep it here rather than under mail.waitlist.*.
mail.waitlist.confirm.subject=Potwierdź swój adres — lista oczekujących kivvi·click
mail.waitlist.confirm.preheader=Jedno kliknięcie i jesteś na liście.
mail.waitlist.confirm.heading=Jeszcze jedno kliknięcie
mail.waitlist.confirm.intro=Ktoś — mamy nadzieję, że Ty — zapisał ten adres na listę oczekujących kivvi·click. Potwierdź, że to Twoja skrzynka, a odezwiemy się dokładnie raz: kiedy ruszamy.
mail.waitlist.confirm.button=Potwierdzam adres
mail.waitlist.confirm.expiry=Link jest ważny 7 dni. Po tym czasie wystarczy zapisać się ponownie, a wyślemy nowy.
mail.waitlist.confirm.fallback=Jeśli przycisk nie działa, skopiuj ten adres do przeglądarki:
mail.waitlist.confirm.ignore=Jeśli to nie Ty się zapisywałeś, nic nie rób — bez potwierdzenia nie wyślemy niczego więcej, a adres usuniemy.
mail.unsubscribe=Wypisz się
